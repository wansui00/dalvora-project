function categoryMatch(type,p){
  const n=(p.name||'').toLowerCase().replace(/\s+/g,' ').trim();
  const coconut=n.includes('coconutshake') || n.includes('coconut shake');
  const chocolate=n.includes('choco') || n.includes('coklat');
  const tea=n.includes('tea') || n.includes('lemonade') || n.includes('orange');

  if(type==='milk') return coconut && !chocolate;
  if(type==='chocolate') return chocolate;
  if(type==='tea') return tea;
  if(type==='snack') return !coconut && !chocolate && !tea;
  return false;
}

function categoryImage(type){
const found=products.find(p=>categoryMatch(type,p) && p.image && String(p.image).trim());
  if(found){
    return `<img src="${escapeHtml(found.image)}" alt="">`;
  }

  const fallback={
    milk:'🥤',
    chocolate:'🍫',
    tea:'🍊',
    snack:'🍪'
  };

  return fallback[type]||'🥤';
}

function change(id,delta){
  id=String(id);

  save();
  const q=$('q-'+id); if(q) q.textContent=Number(cartData[id]||0);
}

  if(!cfg.clientKey) throw new Error('Midtrans client key belum tersedia');

  await new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src=cfg.isProduction
      ? 'https://app.midtrans.com/snap/snap.js'
      : 'https://app.sandbox.midtrans.com/snap/snap.js';
    script.setAttribute('data-client-key',cfg.clientKey);
    script.onload=resolve;
    script.onerror=()=>reject(new Error('Gagal memuat Midtrans Snap'));

let checkoutPromo=null;

async function checkout(){
  if(!token) return login();
  const storeRes=await fetch('/api/store-settings',{cache:'no-store'});
  const store=await storeRes.json();

  if(!storeRes.ok){
    return alert(store.error||'Gagal mengecek jam operasional toko');
  }

  if(!store.active){
    return alert(`Toko sedang tutup. Jam buka ${store.open_time} - ${store.close_time}`);
  }

  const jakartaParts=new Intl.DateTimeFormat('en-GB',{
    timeZone:'Asia/Jakarta',
    hour:'2-digit',
    minute:'2-digit',
    hourCycle:'h23'
  }).formatToParts(new Date());

  const currentTime=
    jakartaParts.find(x=>x.type==='hour').value+':'+
    jakartaParts.find(x=>x.type==='minute').value;

  const openTime=store.open_time;
  const closeTime=store.close_time;

  const isOpen=openTime<closeTime
    ? currentTime>=openTime && currentTime<closeTime
    : currentTime>=openTime || currentTime<closeTime;

  if(!isOpen){
    return alert(`Toko sedang tutup. Jam buka ${openTime} - ${closeTime}`);
  }
  const ids=Object.keys(cartData).filter(id=>Number(cartData[id])>0);
  if(!ids.length) return alert('Keranjang masih kosong');

  checkoutPromo=null;

  let subtotal=0;

  ids.forEach(id=>{
    const p=products.find(x=>String(x.id)===String(id));
    if(p) subtotal+=p.price*Number(cartData[id]);
  });

  const nama=user?.name||'';

  modal('Checkout',`
    <div class="form">
      <input id="cn" value="${escapeHtml(nama)}" placeholder="Nama">
      <input id="cp" inputmode="tel" placeholder="WhatsApp">
      <textarea id="ca" placeholder="Alamat"></textarea>

      <select id="pm">
        <option>QRIS</option>
        <option>Transfer Bank</option>
        <option>COD</option>
      </select>

      <div style="margin-top:12px;">
        <b>Promo / Diskon</b>

        <div style="display:flex;gap:6px;margin-top:6px;">
          <input id="promoCode" placeholder="Masukkan kode promo" style="flex:1;text-transform:uppercase;">
          <button type="button" class="btn" onclick="applyPromo()">Terapkan</button>
        </div>

        <div id="promoInfo" class="muted" style="margin-top:6px;"></div>
      </div>

      <div style="margin-top:15px;padding:12px;background:#f5f7fa;border-radius:10px;">
        <div style="display:flex;justify-content:space-between;">
          <span>Subtotal</span>
          <b id="checkoutSubtotal">${rp(subtotal)}</b>
        </div>

        <div style="display:flex;justify-content:space-between;margin-top:6px;">
          <span>Diskon</span>
          <b id="checkoutDiscount">- ${rp(0)}</b>
        </div>

        <hr>

        <div style="display:flex;justify-content:space-between;font-size:18px;">
          <span>Total</span>
          <b id="checkoutTotal">${rp(subtotal)}</b>
        </div>
      </div>

      <button type="button" class="btn" style="width:100%;margin-top:12px;" onclick="order()">
        Buat Pesanan
      </button>
    </div>
  `);
}

async function applyPromo(){
  const input=$('promoCode');
  const info=$('promoInfo');

  if(!input) return;

  const code=input.value.trim().toUpperCase();

  if(!code){
    checkoutPromo=null;
    if(info) info.textContent='Masukkan kode promo terlebih dahulu.';
    updateCheckoutTotal(0);
    return;
  }

  if(info) info.textContent='Memeriksa kode promo...';

  try{
    const r=await fetch('/api/promo/check',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code})
    });

    const d=await r.json();

    if(!r.ok){
      checkoutPromo=null;
      if(info) info.textContent=d.error||'Kode promo tidak valid.';
      updateCheckoutTotal(0);
      return;
    }

    checkoutPromo=d.promo;

    const subtotal=getCheckoutSubtotal();
    let discount=0;

    if(d.promo.type==='percent'){
      discount=Math.round(subtotal*(Number(d.promo.value)||0)/100);
    }else{
      discount=Number(d.promo.value)||0;
    }

    discount=Math.max(0,Math.min(discount,subtotal));

    if(info) info.textContent='Promo '+d.promo.code+' berhasil diterapkan.';

    updateCheckoutTotal(discount);

  }catch(e){
    checkoutPromo=null;
    if(info) info.textContent='Tidak dapat memeriksa kode promo.';
    updateCheckoutTotal(0);
  }
}

function getCheckoutSubtotal(){
  let subtotal=0;

  Object.entries(cartData).forEach(([id,q])=>{
    const qty=Number(q)||0;
    if(qty<=0) return;

    const p=products.find(x=>String(x.id)===String(id));
    if(p) subtotal+=p.price*qty;
  });

  return subtotal;
}

function updateCheckoutTotal(discount){
  const subtotal=getCheckoutSubtotal();

  discount=Math.max(0,Math.min(Number(discount)||0,subtotal));

  const total=Math.max(0,subtotal-discount);

  const sub=$('checkoutSubtotal');
  const dis=$('checkoutDiscount');
  const tot=$('checkoutTotal');

  if(sub) sub.textContent=rp(subtotal);
  if(dis) dis.textContent='- '+rp(discount);
  if(tot) tot.textContent=rp(total);
}

async function checkPaymentStatus(orderId){
  try{
    const r = await fetch('/api/midtrans/status/' + encodeURIComponent(orderId), {
      headers: { Authorization: 'Bearer ' + token }
    });
    const d = await r.json();

    if(!r.ok){
      return alert(d.error || 'Gagal mengecek status pembayaran');
    }

    let status = d.transaction_status || 'unknown';

    if(status === 'settlement' || (status === 'capture' && d.fraud_status === 'accept')){
      status = 'paid';
    }else if(status === 'expire' || status === 'cancel' || status === 'deny'){
      status = 'failed';
    }else{
      status = 'pending';
    }

    alert('Pesanan: ' + orderId + '\nStatus pembayaran: ' + status);

    load();
  }catch(e){
    alert('Tidak dapat mengecek status pembayaran');
  }
}

    const r=await fetch('/api/orders',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+token
      },
      body:JSON.stringify({
        name,
        phone,
        address,
        payment_method,
          items,
          promo_code:checkoutPromo?.code||''
        })
    });

    const d=await r.json();

    if(!r.ok){
      if(r.status===401){
        token='';
        user=null;
        localStorage.removeItem('dv_token');
        localStorage.removeItem('dv_user');
        authUI();
        return login();
      }
      return alert(d.error||'Pesanan gagal dibuat');
    }

    cartData={};
    save();

    if(d.payment?.provider==='midtrans'){
    closeM();

    if(!d.payment.qr_url){
        return modal('Pembayaran',`
            <h3>${escapeHtml(d.order_no)}</h3>
            <p>Total ${rp(d.total)}</p>
            <p class="muted">QR pembayaran belum tersedia.</p>
            <button type="button" class="btn" onclick="closeM()">Tutup</button>
        `);
    }

    modal('Pembayaran',`
        <div style="text-align:center;">
            <div style="font-size:24px;font-weight:800;margin-bottom:12px;">
                Pembayaran GoPay QRIS
            </div>

            <img
                src="${d.payment.qr_url}"
                alt="QRIS GoPay"
                style="width:280px;max-width:85%;display:block;margin:15px auto;"
            >

            <p class="muted">
                Scan QR di aplikasi GoPay atau aplikasi pembayaran lainnya
            </p><div style="margin:18px 0;padding:15px;background:#eef5ff;border-radius:12px;text-align:left;">
    <b>🔗 Link Pembayaran (Sandbox)</b><br>
    <a
        href="${d.payment.redirect_url||'#'}"
        target="_blank"
        style="word-break:break-all;"
    >${d.payment.redirect_url||'Link pembayaran tidak tersedia'}</a>
    <br><br>
    <button
        type="button"
        class="btn"
        onclick="navigator.clipboard.writeText('${d.payment.redirect_url||''}').then(()=>alert('Link berhasil disalin'))"
    >Salin Link</button>
</div>


            <button
                type="button"
                class="btn"
                onclick="checkPaymentStatus('${escapeHtml(d.order_no)}')"
            >Cek Status Pembayaran</button><br>

            <button
                type="button"
                class="btn"
                onclick="closeM()"
            >Selesai</button>
        </div>
    `);

    return;
}
modal('Pesanan dibuat',`
      <h3>${escapeHtml(d.order_no)}</h3>
      <p>Total ${rp(d.total)}</p>
      <p class="muted">Pesanan berhasil dibuat.</p>
      <button type="button" class="btn" onclick="closeM()">Selesai</button>
    `);

  }catch(e){
    alert('Tidak dapat terhubung ke server');
  }
}
authUI();load();loadStoreContact();
</script>
